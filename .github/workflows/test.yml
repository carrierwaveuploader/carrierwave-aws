name: Test

on: [push, pull_request]

jobs:
  test:
    name: RSpec
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4']
        gemfile: [gemfiles/carrierwave-3.gemfile]
        experimental: [false]
        include:
          - ruby: '3.4'
            gemfile: gemfiles/carrierwave-2.gemfile
            experimental: false
          - ruby: '3.4'
            gemfile: gemfiles/carrierwave-master.gemfile
            experimental: false
          - ruby: ruby-head
            gemfile: gemfiles/carrierwave-3.gemfile
            experimental: true
          - ruby: jruby-head
            gemfile: gemfiles/carrierwave-2.gemfile
            experimental: false
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    env:
      S3_BUCKET_NAME: test-bucket
      S3_ACCESS_KEY: DummyAccessKey
      S3_SECRET_ACCESS_KEY: DummySecret
      AWS_REGION: us-east-1
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      JRUBY_OPTS: --debug
    steps:
    - name: Run RustFS
      run: |
        docker run -d -p 9000:9000 --name rustfs \
                   -e "RUSTFS_ACCESS_KEY=${{ env.S3_ACCESS_KEY }}" \
                   -e "RUSTFS_SECRET_KEY=${{ env.S3_SECRET_ACCESS_KEY }}" \
                   rustfs/rustfs:latest /data
        for i in $(seq 1 30); do
          if AWS_ACCESS_KEY_ID=${{ env.S3_ACCESS_KEY }} AWS_SECRET_ACCESS_KEY=${{ env.S3_SECRET_ACCESS_KEY }} \
             aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://${{ env.S3_BUCKET_NAME }}; then
            break
          fi
          sleep 2
        done
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run RSpec
      run: bundle exec rake spec

  rubocop:
    name: RuboCop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run check
        run: bundle exec rake rubocop
